[project]
name = "qe_mobile"
authors = [{ name = "QE Projects" }]
description = "Server side of the QE Mobile app (attendance with NFC / geofence / Wi-Fi, mobile API)"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = ["cryptography"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
